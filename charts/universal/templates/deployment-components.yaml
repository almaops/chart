{{- range $compName, $comp := .Values.components }}
{{- if $comp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "universal.fullname" $ }}-{{ $compName }}
  labels:
    {{- include "universal.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $compName }}
spec:
  replicas: {{ $comp.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "universal.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $compName }}
  template:
    metadata:
      labels:
        {{- include "universal.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $compName }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $compName }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy | default "IfNotPresent" }}
          {{- if $comp.command }}
          command:
            {{- toYaml $comp.command | nindent 12 }}
          {{- end }}
          {{- if $comp.args }}
          args:
            {{- toYaml $comp.args | nindent 12 }}
          {{- end }}
          {{- if $comp.ports }}
          ports:
            {{- range $comp.ports }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          {{- end }}
          {{- if or $.Values.envFrom $.Values.configData $.Values.secretData }}
          envFrom:
            {{- if $.Values.configData }}
            - configMapRef:
                name: {{ include "universal.fullname" $ }}-config
            {{- end }}
            {{- if $.Values.secretData }}
            - secretRef:
                name: {{ include "universal.fullname" $ }}-secret
            {{- end }}
            {{- if $.Values.envFrom }}
            {{- toYaml $.Values.envFrom | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if $.Values.env }}
          env:
            {{- toYaml $.Values.env | nindent 12 }}
          {{- end }}
          {{- if $.Values.volumeMounts }}
          volumeMounts:
            {{- toYaml $.Values.volumeMounts | nindent 12 }}
          {{- end }}
      {{- if $.Values.volumes }}
      volumes:
        {{- tpl (toYaml $.Values.volumes) $ | nindent 8 }}
      {{- end }}
---
{{- end }}
{{- end }}
