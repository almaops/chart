{{- if .Values.secretData }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "universal.fullname" . }}-secret
  labels:
    {{- include "universal.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10" # Lower number runs FIRST
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  {{- range $key, $val := .Values.secretData }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}
{{- end }}
