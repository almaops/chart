{{- if and .Values.initJob .Values.initJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "universal.fullname" . }}-init
  labels:
    {{- include "universal.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
spec:
  template:
    metadata:
      name: {{ include "universal.fullname" . }}-init
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: init-script
          image: "{{ .Values.initJob.image.repository | default .Values.image.repository }}:{{ .Values.initJob.image.tag | default .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.initJob.image.pullPolicy | default "IfNotPresent" }}
          {{- if .Values.initJob.command }}
          command:
            {{- toYaml .Values.initJob.command | nindent 12 }}
          {{- end }}
          {{- if .Values.initJob.args }}
          args:
            {{- toYaml .Values.initJob.args | nindent 12 }}
          {{- end }}
          {{- if or .Values.envFrom .Values.configData .Values.secretData }}
          envFrom:
            {{- if .Values.configData }}
            - configMapRef:
                name: {{ include "universal.fullname" . }}-config
            {{- end }}
            {{- if .Values.secretData }}
            - secretRef:
                name: {{ include "universal.fullname" . }}-secret
            {{- end }}
            {{- if .Values.envFrom }}
            {{- toYaml .Values.envFrom | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.env }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          {{- end }}
          {{- if .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml .Values.volumeMounts | nindent 12 }}
          {{- end }}
      {{- if .Values.volumes }}
      volumes:
        {{- tpl (toYaml .Values.volumes) . | nindent 8 }}
      {{- end }}
{{- end }}
